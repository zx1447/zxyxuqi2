name: Revenact Daily + AFK

# Revenact 控制台（console.revenact.io）
#
# 规则（用户指定）：有签到就签到 → 挂机 → 跑完就结束 → 停 44 分钟 → 再来一次
#
# 就是「checkout → 装 Python → 跑一次 → 结束」，不管具体挂多少分钟。
# 脚本自己跑满整轮：签到（到期才领）+ 挂机直到额度满或接近 job 上限才停。
# 一轮与下一轮之间空 44 分钟，由 cron 时间点保证。
#
# cron 间隔 = 350（跑一轮）+ 44（休息）= 394 分钟，取 388 分钟排班：
#   00:00 → 06:28 → 12:56
# GitHub 定时任务本身有 0~20 分钟排队延迟，实际间隔会在此基础上有小幅浮动。
# ⚠️ GitHub 单 job 硬上限 360 分钟，含 checkout/装环境，故挂机跑到 348 分钟收尾。
on:
  schedule:
    # 每轮 = 跑完（约 350 分钟）→ 空 44 分钟 → 下一轮。间隔 388 分钟。
    # 00:00 → 06:28 → 12:56   （3 轮已足够跑满当日 30 bolts 上限；
    # 额度满了脚本会立刻退出，所以多余的空跑没有成本）
    - cron: '0 0 * * *'
    - cron: '28 6 * * *'
    - cron: '56 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'all / status / claim'
        required: false
        default: 'all'
      verify_code:
        description: 'token 失效时的邮箱 6 位验证码（留空跳过）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: revenact
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: main
          path: rev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 喂验证码（仅在需要时）
        if: ${{ github.event.inputs.verify_code != '' }}
        env:
          REVENACT_EMAIL: ${{ secrets.REVENACT_EMAIL }}
          REVENACT_PASSWORD: ${{ secrets.REVENACT_PASSWORD }}
          REVENACT_TOTP_SECRET: ${{ secrets.REVENACT_TOTP_SECRET }}
          CODE: ${{ github.event.inputs.verify_code }}
        run: |
          python rev/.github/scripts/revenact.py --login-only || true
          python rev/.github/scripts/revenact.py --verify "$CODE"

      - name: 签到 + 挂机
        env:
          REVENACT_TOKEN: ${{ secrets.REVENACT_TOKEN }}
          REVENACT_EMAIL: ${{ secrets.REVENACT_EMAIL }}
          REVENACT_PASSWORD: ${{ secrets.REVENACT_PASSWORD }}
          REVENACT_TOTP_SECRET: ${{ secrets.REVENACT_TOTP_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'all' }}
          AFK: '348'
        run: |
          S=rev/.github/scripts/revenact.py
          case "$MODE" in
            status) python $S --status ;;
            claim)  python $S --claim ;;
            *)      python $S --claim-if-due --afk "${AFK:-348}" ;;
          esac

      - name: 回写状态
        if: always()
        run: |
          cd rev
          F=.github/scripts/revenact_state.json
          if [ -f "$F" ] && ! git diff --quiet "$F"; then
            git config user.name 'zx-build'
            git config user.email 'build@zx.local'
            git add "$F"
            git commit -m "state: revenact [skip ci]" || true
            for i in 1 2 3; do
              git fetch -q origin revenact || true
              git -c user.name='zx-build' -c user.email='build@zx.local' rebase -X theirs origin/revenact >/dev/null 2>&1 \
                || git rebase --abort >/dev/null 2>&1 || true
              git push origin HEAD:revenact && break || sleep $((i*3))
            done
          fi
