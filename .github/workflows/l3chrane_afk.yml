name: L3chrane AFK Earn

# L3chrane X Bots（l3chranexbots.oriaxen.com）AFK 永续挂机
#  · 官网规则：/afk 每 60 秒 +1 coin → 脚本严格 60s 一次 claim，不加速刷
#  · 节拍：挂满 360 分钟 → 休息 44 分钟 → 再挂满 360 分钟 → …… 永续
#  · GH Actions 单 job 上限 6h(360min)，所以一个 run 里放两个 job 顺序执行：
#      job work（355 min，timeout 375） → job cool（44 min，timeout 60） → 自派发下一个 run
#    work 用 355 而不是 360：checkout/setup 等开销约 1 分钟，留余量免得被 6h 硬切断
on:
  schedule:
    - cron: '23 */6 * * *'      # 兜底：接力链断了 6 小时内自愈
  workflow_dispatch:
    inputs:
      work_min:
        description: '挂机时长（分钟，默认 355）'
        required: false
        default: '355'
      cool_min:
        description: '休息时长（分钟，默认 44；0 = 不休息连挂）'
        required: false
        default: '44'

concurrency:
  group: l3chrane-afk
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 375
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AFK 挂机（官网节奏 1 分钟 1 积分）
        env:
          L3CH_DISCORD_TOKEN: ${{ secrets.L3CH_DISCORD_TOKEN }}
          L3CH_GOAL: '0'          # 0 = 不设上限，一直挂
          L3CH_DELAY: '60'        # 官网规则：60 秒 1 coin
          WORK_MIN: ${{ github.event.inputs.work_min || '355' }}
        run: |
          echo "🔥 work 段 $WORK_MIN 分钟"
          python3 l3chrane_afk.py --loop "$WORK_MIN"

      - name: 回写会话/状态
        if: always()
        run: |
          git config user.name 'zx-build'
          git config user.email 'build@zx.local'
          if git diff --quiet l3chrane_state.json 2>/dev/null && git diff --cached --quiet l3chrane_state.json 2>/dev/null; then
            echo "无状态变化"; exit 0
          fi
          git add l3chrane_state.json
          git commit -m "state: l3chrane afk [skip ci]" || true
          for i in 1 2 3; do
            git fetch -q origin l3chrane || true
            git -c user.name='zx-build' -c user.email='build@zx.local' rebase -X theirs origin/l3chrane >/dev/null 2>&1 \
              || { git rebase --abort >/dev/null 2>&1 || true; }
            if git push origin HEAD:l3chrane 2>/dev/null; then
              echo "✅ 状态已回写（第 $i 次）"; exit 0
            fi
            echo "⚠️ 第 $i 次 push 被拒，重试…"; sleep $((i*3))
          done
          echo "⚠️ 状态回写失败——不影响赚币结论"

  cool:
    needs: work
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 休息（完全不碰站点接口）
        env:
          COOL_MIN: ${{ github.event.inputs.cool_min || '44' }}
        run: |
          echo "🧊 休息 $COOL_MIN 分钟"
          python3 l3chrane_afk.py --cool "$COOL_MIN"

      # 只有正常跑完才接力；手动取消不派发，避免「取消→接力→再取消」的连锁
      - name: 自派发接力（下一轮：挂满 → 休息 → 挂满）
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_PAT 未配置，跳过接力"; exit 0; fi
          gh workflow run l3chrane_afk.yml -R "$GITHUB_REPOSITORY" \
            -f work_min=355 -f cool_min=44 \
            && echo "✅ 已派发下一轮" || echo "⚠️ 接力失败（schedule 兜底）"
