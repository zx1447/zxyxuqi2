name: OpenGameNode Keepalive

# OpenGameNode（panel.opengamenode.com，Calagopus）。脚本在 opengamenode 分支。
# 纯 HTTP：无浏览器、无 Turnstile、无代理。登录用 Discord OAuth。
#
# 策略：前期能续就精准续（到期前 60 秒发 extend，窗口是最后 600 秒），
#       续期额度用尽后等会话到点，再点启动换新会话。
#
# 单会话 4h、可续 2 次 = 12h；单个 job 上限 6h →
# 每轮驻留 350 分钟，cron 每 6 小时接续一次，两轮之间只有 10 分钟空档。

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      dwell_minutes:
        description: '本轮驻留分钟数（默认 350；0=只检查一次）'
        required: false
        default: '350'
      mode:
        description: 'act（执行）或 probe（只读）'
        required: false
        default: 'act'

permissions:
  contents: read

concurrency:
  group: ogn-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengamenode

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 续期 / 启动守护
        env:
          OGN_DISCORD_TOKEN: ${{ secrets.OGN_DISCORD_TOKEN }}
          OGN_DWELL_MINUTES: ${{ github.event.inputs.dwell_minutes || '350' }}
          OGN_EXTEND_AT_SEC: '60'
          OGN_MODE: ${{ github.event.inputs.mode || 'act' }}
        run: python3 ogn_keepalive.py
