name: OpenGameNode Keepalive

# OpenGameNode（panel.opengamenode.com，Calagopus）守护。
# 脚本在 opengamenode 分支；纯 HTTP，无浏览器、无 Turnstile、无代理。
# 登录用 Discord OAuth（secrets.OGN_DISCORD_TOKEN）。
# 免费套餐：会话 4 小时，最多续期 2 次（每次 +4 小时），到点不自动重启。
# 规则：离线→start；剩余≤10min 且还有额度→extend；额度用完→stop→start 换新会话。

on:
  schedule:
    # 会话 4 小时，每 3 小时检查一次，保证下个会话到点前一定有人管
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      dwell_minutes:
        description: '本轮驻留分钟数（0=只检查一次）'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: ogn-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengamenode

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 登录并守护
        env:
          OGN_DISCORD_TOKEN: ${{ secrets.OGN_DISCORD_TOKEN }}
          OGN_DWELL_MINUTES: ${{ github.event.inputs.dwell_minutes || '0' }}
          OGN_CHECK_SECONDS: '300'
        run: python3 ogn_keepalive.py
