name: GGCart Renew

# GGCart 免费服精准续期（Community Free）。
# 代码在 ggcart 分支（ggcart_renew.py），workflow 留在 main。
# 续期只在到期前 48 小时内开放；窗口外脚本只读退出，不发续期请求。
# 已取消每 6 小时轮询（用户否决）。定时待确认后再加 schedule，目前仅手动触发。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggcart-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ggcart

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Renew
        env:
          GG_EMAIL: ${{ secrets.GG_EMAIL }}
          GG_PASS: ${{ secrets.GG_PASS }}
        run: python ggcart_renew.py
