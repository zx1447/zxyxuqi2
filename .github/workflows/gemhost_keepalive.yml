name: GemHost Keepalive

# GemHost.pl 免费服（nice / 8331623）：每 6 小时检查一次，停了就 start。
# 免费会话 360 分钟，耗尽自动停机。这里只用 start，不用 restart（restart 实测会让服务器离线且不自动恢复）。
# 脚本与 workflow 均在 zx1447/zxyxuqi2。

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: gemhost-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查并拉起
        env:
          GEMHOST_EMAIL: ${{ secrets.GEMHOST_EMAIL }}
          GEMHOST_PASSWORD: ${{ secrets.GEMHOST_PASSWORD }}
        run: python3 gemhost_keepalive.py
