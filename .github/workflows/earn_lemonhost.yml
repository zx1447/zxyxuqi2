name: LemonHost AFK Claim

on:
  # 兜底触发：自派发失败时由这里接上。时间避开整点减少排队。
  schedule:
    - cron: "37 */8 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数（GitHub 单 job 上限 360）"
        required: false
        default: "5"
      dry_run:
        description: "只探测接口不实际领取 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write   # 自派发下一轮需要，否则只能用 PAT

concurrency:
  group: lemonhost-afk-claim-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lemo branch（代码在 lemo，workflow 在 main）
        uses: actions/checkout@v4
        with:
          ref: lemo
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Run LemonHost AFK claim
        env:
          LEMONHOST_API_KEY: ${{ secrets.LEMONHOST_API_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TICK_SECONDS: "90"
          CAP_STALL_MINUTES: "30"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python earn_lemonhost.py

      - name: Save LemonHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lemo_state.json || true
          if git diff --cached --quiet; then
            echo "No LemonHost state change."
            exit 0
          fi
          git commit -m "Update LemonHost state [skip ci]"
          git push origin HEAD:lemo

      # 自派发接力已移除（按强度要求：单轮 ≤15 分钟 + 每 6 小时 cron 即可）
