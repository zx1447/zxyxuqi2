name: BotHoster Keepalive
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'service / status / renew / afk / probe'
        required: false
        default: 'service'
permissions:
  contents: read
concurrency:
  group: bothoster-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bothoster
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 连接订阅代理
        env:
          AFK_SUBSCRIPTION_URL: ${{ secrets.AFK_SUBSCRIPTION_URL }}
        run: |
          set -eu
          python bothoster_proxy.py
          curl -fsSL --max-time 45 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  /tmp/xray.zip' | sha256sum -c -
          unzip -qo /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray run -test -config /tmp/afk-proxy.json >/dev/null
          nohup /tmp/xray/xray run -config /tmp/afk-proxy.json >/tmp/xray.log 2>&1 &
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS --noproxy '' --max-time 8 -x http://127.0.0.1:17890 https://www.cloudflare.com/cdn-cgi/trace >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo '::error::订阅代理不可用；不回退直连'; exit 1; fi
          echo '订阅代理连通'
      - name: 服务器与 AFK
        env:
          BOTHOSTER_DISCORD_TOKEN: ${{ secrets.BOTHOSTER_DISCORD_TOKEN }}
          BH_PROXY: http://127.0.0.1:17890
          BH_MODE: ${{ inputs.mode || 'service' }}
          BH_SERVER_ID: '13'
          BH_RESERVE_COINS: '1'
        run: python bothoster.py
