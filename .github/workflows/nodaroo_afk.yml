name: Nodaroo AFK

# 节奏：单次挂机 10 分钟（受 job 15 分钟上限约束），由 cron 每 6 小时触发。
#
# ⚠️ 2026-11-20 改造：原本设计是「挂 355 分钟 + 冷却 30 分钟 + GH_PAT 接力」，
#    这种长驻 + 自派发的模式导致仓库被 GitHub 判定滥用 ToS 而封锁。
#    现在改为「短单轮 + cron 定时」，不再自己派发下一棒。
#
# 分支结构（2026-11-23）：workflow 留在 main；代码与登录态放独立分支 nodarooAFK。
#    代价：每天只能挂 4 × 10 = 40 分钟，收益远低于原来的 22.4 小时/天。
#    如需更多挂机时间，应在本机运行，而不是占用 GitHub Actions。
#
# 方案：纯 Python（requests + websockets）直连，无浏览器、无 cf_clearance
# （CI 实测直连可用：2 分钟 +2 credits 到账）。cf_clearance 与出口 IP 强
# 绑定是旧浏览器方案卡死的根因，纯 HTTP 不触发 CF 托管挑战。若直连被拦，
# 脚本内自动拉 xray 走 NODAROO_VLESS_URL 家宽出口兜底。
#
# 登录：cookie 三级回退（加密存档 → 静态 → OAuth）。登录态由 CI 提交回
# nodarooAFK 分支跨棒传递，OAuth 只在 cookie 失效时发生（cookie 有效期
# 14 天，即约两周一次），把 Discord 侧风控暴露降到最低。
# 业务脚本在 nodarooAFK 分支（根目录 nodaroo_afk.py）。

on:
  schedule:
    # 兜底：每 6 小时探一次，若接力链断了能自己接回来（从挂机棒起）
    - cron: '31 */6 * * *'
  workflow_dispatch:
    inputs:
      farm_minutes:
        description: '本轮挂机分钟数（默认 10；快测填 2）'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: nodaroo-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nodarooAFK

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --quiet requests websockets python-socks pysocks cryptography

      - name: Install xray (VLESS 家宽出口兜底)
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d "$HOME/.xray" && chmod +x "$HOME/.xray/xray"
          "$HOME/.xray/xray" version | head -1

      - name: Farm AFK credits
        env:
          NODAROO_DISCORD_TOKEN: ${{ secrets.NODAROO_DISCORD_TOKEN }}
          NODAROO_SESSION_KEY: ${{ secrets.NODAROO_SESSION_KEY }}
          NODAROO_COOKIE: ${{ secrets.NODAROO_COOKIE }}
          NODAROO_VLESS_URL: ${{ secrets.NODAROO_VLESS_URL }}
          NODAROO_FARM_MINUTES: ${{ github.event.inputs.farm_minutes || '10' }}
          NODAROO_NO_EARN_MINUTES: '3'
        run: python nodaroo_afk.py

      - name: 提交登录态
        if: always()
        run: |
          if [ -f nodaroo_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nodaroo_state.json
            git commit -m "chore(nodarooAFK): 更新登录态 [skip ci]" || echo "无变化"
            # 远端可能被上一棒推过 -> fetch+rebase 重试，避免 non-fast-forward
            for i in 1 2 3; do
              if git push origin HEAD:nodarooAFK; then break; fi
              git fetch origin nodarooAFK || true
              git rebase origin/nodarooAFK || git rebase --abort
              sleep 5
            done
          fi

