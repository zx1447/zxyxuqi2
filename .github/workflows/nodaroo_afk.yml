name: Nodaroo AFK

# 节奏（用户指定）：启动后挂满（≈360 分钟）→ 等待半小时 → 继续。
#
# GitHub 单 job 硬上限 360 分钟，「挂满 360 + 冷却 30」装不进同一个 job
# （超时被杀时接力步也一起没了，链会断）。所以拆成两种棒交替：
#   挂机棒 (phase=1)：挂 355 分钟（留 ~5 分钟余量给环境和派发）
#                     → 提交登录态 → 派发冷却棒
#   冷却棒 (phase=2)：不挂机 → 冷却 30 分钟 → 派发下一个挂机棒
# 一轮 = 355 挂机 + 30 冷却 ≈ 6h25m，每天 ≈ 22.4 小时在挂，理论上限
# ≈ 1345 credits/天。挂机棒中途断线会自动重连接着挂（站点明确允许）。
#
# 方案：纯 Python（requests + websockets）直连，无浏览器、无 cf_clearance
# （CI 实测直连可用：2 分钟 +2 credits 到账）。cf_clearance 与出口 IP 强
# 绑定是旧浏览器方案卡死的根因，纯 HTTP 不触发 CF 托管挑战。若直连被拦，
# 脚本内自动拉 xray 走 NODAROO_VLESS_URL 家宽出口兜底。
#
# 登录：cookie 三级回退（加密存档 → 静态 → OAuth）。登录态由 CI 提交回
# nodarooAFK 分支跨棒传递，OAuth 只在 cookie 失效时发生（cookie 有效期
# 14 天，即约两周一次），把 Discord 侧风控暴露降到最低。
# 业务脚本在 nodarooAFK 分支（.github/scripts/nodaroo_afk.py）。

on:
  schedule:
    # 兜底：每 6 小时探一次，若接力链断了能自己接回来（从挂机棒起）
    - cron: '31 */6 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: '棒类型：1=挂机棒（挂完派冷却棒）；2=冷却棒（冷却完派挂机棒）'
        required: false
        default: '1'
      farm_minutes:
        description: '本棒挂机分钟数（挂机棒默认 355；冷却棒传 0；快测填 2）'
        required: false
        default: '355'
      cooldown_minutes:
        description: '冷却棒等待分钟数（默认 30；快测填 0）'
        required: false
        default: '30'
      relay:
        description: '是否接力：1=派发下一棒（默认）；0=单发一轮（测试用）'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: nodaroo-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout nodarooAFK branch
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --quiet requests websockets python-socks pysocks cryptography

      - name: Install xray (VLESS 家宽出口兜底)
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d "$HOME/.xray" && chmod +x "$HOME/.xray/xray"
          "$HOME/.xray/xray" version | head -1

      - name: Farm AFK credits
        env:
          NODAROO_DISCORD_TOKEN: ${{ secrets.NODAROO_DISCORD_TOKEN }}
          NODAROO_SESSION_KEY: ${{ secrets.NODAROO_SESSION_KEY }}
          NODAROO_COOKIE: ${{ secrets.NODAROO_COOKIE }}
          NODAROO_VLESS_URL: ${{ secrets.NODAROO_VLESS_URL }}
          NODAROO_FARM_MINUTES: ${{ github.event.inputs.farm_minutes || inputs.farm_minutes || '355' }}
          NODAROO_NO_EARN_MINUTES: '10'
        run: python .github/scripts/nodaroo_afk.py

      - name: 提交登录态
        if: always()
        run: |
          if [ -f nodaroo_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nodaroo_state.json
            git commit -m "chore(nodarooAFK): 更新登录态 [skip ci]" || echo "无变化"
            # 远端可能被上一棒推过 -> fetch+rebase 重试，避免 non-fast-forward
            for i in 1 2 3; do
              if git push origin HEAD:nodarooAFK; then break; fi
              git fetch origin nodarooAFK:nodarooAFK || true
              git rebase nodarooAFK || git rebase --abort
              sleep 5
            done
          fi

