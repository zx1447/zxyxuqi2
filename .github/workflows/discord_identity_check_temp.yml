name: Temporary Discord identity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify identities without disclosing tokens
        env:
          AURIX_DISCORD_TOKEN: ${{ secrets.AURIX_DISCORD_TOKEN }}
          BLINKY_DISCORD_TOKEN: ${{ secrets.BLINKY_DISCORD_TOKEN }}
          BOTHOSTER_DISCORD_TOKEN: ${{ secrets.BOTHOSTER_DISCORD_TOKEN }}
          MWS_DISCORD_TOKEN: ${{ secrets.MWS_DISCORD_TOKEN }}
          NODAROO_DISCORD_TOKEN: ${{ secrets.NODAROO_DISCORD_TOKEN }}
          OGN_DISCORD_TOKEN: ${{ secrets.OGN_DISCORD_TOKEN }}
          SC_DISCORD_TOKEN: ${{ secrets.SC_DISCORD_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os,json,urllib.request,urllib.error,time
          names=['AURIX_DISCORD_TOKEN', 'BLINKY_DISCORD_TOKEN', 'BOTHOSTER_DISCORD_TOKEN', 'MWS_DISCORD_TOKEN', 'NODAROO_DISCORD_TOKEN', 'OGN_DISCORD_TOKEN', 'SC_DISCORD_TOKEN']
          for name in names:
              token=os.environ.get(name,'').strip()
              if not token:
                  print(name,'EMPTY',flush=True);continue
              try:
                  req=urllib.request.Request('https://discord.com/api/v10/users/@me',headers={'Authorization':token,'User-Agent':'IdentityCheck/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      user=json.load(r)
                      nameset=[str(user.get('username') or '').lower(),str(user.get('global_name') or '').lower()]
                      if 'laihate' in nameset:
                          print(name,'MATCH VALID','username',user.get('username'),'user_id',user.get('id'),flush=True)
                      else:print(name,'VALID_NOT_LAIHATE',flush=True)
              except urllib.error.HTTPError as e:
                  print(name,'HTTP',e.code,flush=True)
              except Exception as e:
                  print(name,'ERROR',type(e).__name__,flush=True)
              time.sleep(1)
          PYCODE
