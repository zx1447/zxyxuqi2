name: Blinky Poland Login Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blinky
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests cryptography pysocks
      - name: 安装并校验 Xray
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  /tmp/xray.zip' | sha256sum -c -
          unzip -qo /tmp/xray.zip -d "$HOME/.xray"
          chmod +x "$HOME/.xray/xray"
      - name: 检查波兰出口和只读登录
        env:
          BLINKY_USER: ${{ secrets.BLINKY_USER }}
          BLINKY_PASS: ${{ secrets.BLINKY_PASS }}
          BLINKY_VLESS_URL: ${{ secrets.BLINKY_VLESS_URL }}
        run: |
          python - <<'PYCODE'
          import requests, urllib.parse
          import blinky_probe as bp
          import blinky_renew as br
          proxies=bp.start_xray()
          if not proxies:
              print('❌ 没有可用的 Blinky 代理配置'); raise SystemExit(2)
          s=bp.session(proxies)
          s.trust_env=False
          geo=None
          for url,field in [('https://ipwho.is/','country_code'), ('https://ipapi.co/json/','country_code')]:
              try:
                  rr=s.get(url,timeout=20); rr.raise_for_status(); geo=rr.json().get(field)
                  if geo: break
              except Exception as e:
                  print('⚠️ 出口定位查询失败:', type(e).__name__)
          print('出口国家:',geo or '无法确认')
          if geo != 'PL':
              print('❌ 不符合波兰出口要求，不进行 Blinky 登录测试'); raise SystemExit(2)
          try:
              r=s.get(bp.BASE+'/auth/discord/login',timeout=30,allow_redirects=False)
              host=urllib.parse.urlparse(r.headers.get('location','')).hostname
              print('Discord 登录入口 HTTP',r.status_code,'重定向目标域名:',host or '无')
              ok,msg=bp.login(s)
              print('波兰出口账号登录:', '成功' if ok else '失败', '403/1012 风控' if not ok and bp.blocked(msg) else (msg[:120] if not ok else ''))
              if not ok: raise SystemExit(2)
              d=br.read_renewal(s)
              print('只读续期状态: 到期',d.get('expiration_date'),'can_renew',d.get('can_renew'),'状态',d.get('server_status'))
              state,suspended=br.state_of(s)
              print('只读运行状态:',state,'suspended=',suspended)
          except SystemExit: raise
          except Exception as e:
              print('❌ 登录或读取失败:',type(e).__name__);raise SystemExit(2)
          PYCODE
      - name: 清理临时配置
        if: always()
        run: rm -f /tmp/blinky_xray.json /tmp/blinky_xray.log
