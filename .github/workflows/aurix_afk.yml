name: Aurix AFK + Renew

# Aurix Host（dash.aurix.host/#/earn）。脚本在 aurix 分支。
# 循环：AFK 挂到本轮结束（默认 5 小时）→ 每个会话 20 分钟 → 休息 44 分钟 → 继续。
# 每个会话的 afk/start 都要新的 Turnstile token，所以循环内按需开一次浏览器点复选框。
# 续期：只在剩余 ≤48 小时（最后 2 天）且余额 ≥ 20 coins 时才发请求。

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: '本轮循环总时长（分钟）'
        required: false
        default: '300'
      rest_minutes:
        description: '会话之间休息（分钟）'
        required: false
        default: '44'

permissions:
  contents: read

concurrency:
  group: aurix-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aurix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright + Chromium + Xvfb
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: 过 gate + AFK 循环 + 续期
        env:
          AURIX_DISCORD_TOKEN: ${{ secrets.AURIX_DISCORD_TOKEN }}
          AURIX_TOKENS_FILE: ${{ runner.temp }}/aurix_tokens.json
          AURIX_RUN_MINUTES: ${{ github.event.inputs.run_minutes || '300' }}
          AURIX_REST_MINUTES: ${{ github.event.inputs.rest_minutes || '44' }}
          AURIX_RENEW_AT_HOURS: '48'
          AURIX_MODE: act
        run: |
          # gate token 只在新登录时需要，先产一次
          xvfb-run -a python3 aurix_afk.py --tokens
          # 主循环：xvfb 必须包住整个进程，循环里要用 Chromium 产 afk token
          xvfb-run -a python3 aurix_afk.py
