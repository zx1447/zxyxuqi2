name: Aurix AFK + Renew

# Aurix Host（dash.aurix.host/#/earn）。脚本在 aurix 分支。
# 流程：真浏览器点一下 Turnstile → 纯 HTTP 登录 / 过入场 gate / AFK 挂机 / 到期前续期。
# 规则：入场 gate 按会话计，每次登录都要重过（30s 计时）；AFK 20 分钟一轮 +8 coins；
#       续期 20 coins / 14 天，只在剩余 <48h 且余额足够时才发请求。

on:
  schedule:
    # 每天两轮。需求只有 1.43 coins/天，两轮能产 16 coins，余量很大。
    - cron: '23 */12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'act（挂机+续期）或 probe（只读）'
        required: false
        default: 'act'

permissions:
  contents: read

concurrency:
  group: aurix-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aurix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright + Chromium + Xvfb
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: 取 Turnstile token（真浏览器点一下）
        env:
          AURIX_DISCORD_TOKEN: ${{ secrets.AURIX_DISCORD_TOKEN }}
          AURIX_TOKENS_FILE: ${{ runner.temp }}/aurix_tokens.json
        run: xvfb-run -a python3 aurix_afk.py --tokens

      - name: 过 gate → AFK → 续期（纯 HTTP）
        env:
          AURIX_DISCORD_TOKEN: ${{ secrets.AURIX_DISCORD_TOKEN }}
          AURIX_TOKENS_FILE: ${{ runner.temp }}/aurix_tokens.json
          AURIX_AFK_MINUTES: '21'
          AURIX_RENEW_AT_HOURS: '48'
          AURIX_MODE: ${{ github.event.inputs.mode || 'act' }}
        run: python3 aurix_afk.py
