name: Blinky Direct Login Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blinky
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests cryptography
      - name: 仅直连测试登录并只读检查
        env:
          BLINKY_USER: ${{ secrets.BLINKY_USER }}
          BLINKY_PASS: ${{ secrets.BLINKY_PASS }}
        run: |
          python - <<'PYCODE'
          import blinky_probe as bp
          import blinky_renew as br
          s = bp.session()
          try:
              ok, msg = bp.login(s)
              if not ok:
                  if bp.blocked(msg): print('❌ 直连登录被 M.E.O.W 风控阻挡（403/1012）')
                  else: print('❌ 直连登录失败:', msg[:100])
                  raise SystemExit(2)
              print('✅ 直连登录成功')
              try:
                  d=br.read_renewal(s)
                  print('只读续期状态:', 'expiration_date=', d.get('expiration_date'), 'can_renew=', d.get('can_renew'), 'server_status=', d.get('server_status'))
                  state,suspended=br.state_of(s)
                  print('只读运行状态:',state,'suspended=',suspended)
              except Exception as e:
                  print('❌ 登录后查询失败:',type(e).__name__)
                  raise SystemExit(2)
          except SystemExit:
              raise
          except Exception as e:
              print('❌ 直连登录异常:',type(e).__name__)
              raise SystemExit(2)
          PYCODE
