name: Blinky Probe

# Baltic Host（blinky.baltichost.online）登录探针 —— 手动触发。
# 代码在 blinky 分支（blinky_probe.py），workflow 留在 main。
# 直连被风控（403/1012）时，用 NODAROO_VLESS_URL 家宽出口兜底。
# 输出 artifact: blinky-probe（面板页面 HTML + 站点 JS）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinky-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blinky

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet requests cryptography

      - name: Install xray（家宽兜底）
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d "$HOME/.xray" && chmod +x "$HOME/.xray/xray"

      - name: Probe
        env:
          BLINKY_USER: ${{ secrets.BLINKY_USER }}
          BLINKY_PASS: ${{ secrets.BLINKY_PASS }}
          BLINKY_VLESS_URL: ${{ secrets.NODAROO_VLESS_URL }}
        run: python blinky_probe.py

      - name: Upload panel pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinky-probe
          path: out/
          if-no-files-found: ignore
          retention-days: 7
