name: BotHoster Work Connection Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bothoster
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 配置现有出口
        env:
          AFK_SUBSCRIPTION_URL: ${{ secrets.AFK_SUBSCRIPTION_URL }}
        run: |
          set -eu
          python bothoster_proxy.py
          curl --retry 2 --retry-delay 2 -fsSL --max-time 75 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  /tmp/xray.zip' | sha256sum -c -
          unzip -qo /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray run -test -config /tmp/afk-proxy.json >/dev/null
          nohup /tmp/xray/xray run -config /tmp/afk-proxy.json >/tmp/xray.log 2>&1 &
          sleep 3
      - name: 只读网络检查
        run: |
          python - <<'PYCODE'
          import urllib.request,json
          proxy=urllib.request.ProxyHandler({'http':'http://127.0.0.1:17890','https':'http://127.0.0.1:17890'})
          op=urllib.request.build_opener(proxy)
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html'}
          for name,url in [('出口定位','https://ipwho.is/'),('Work.ink 首页','https://work.ink/'),('BotHoster 首页','https://bothoster.top/')]:
              try:
                  with op.open(urllib.request.Request(url,headers=h),timeout=30) as r:
                      raw=r.read(500000)
                      if name=='出口定位':
                          data=json.loads(raw);print(name,'HTTP',r.status,'country',data.get('country_code','未知'),flush=True)
                      else:
                          print(name,'HTTP',r.status,'标题包含防护提示',b'Just a moment' in raw or b'Proxy/VPN Was Detected' in raw,flush=True)
              except Exception as e:print(name,'失败',type(e).__name__,'HTTP',getattr(e,'code','无'),flush=True)
          print('未生成奖励短链、未登录 Work.ink、未领取奖励；首页可达不代表奖励链路可用。',flush=True)
          PYCODE
      - name: 清理配置
        if: always()
        run: rm -f /tmp/afk-proxy.json /tmp/xray.log
