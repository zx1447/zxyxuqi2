name: Plugged Keepalive

# plugged.host（mockingbird）+ CraftingHosting 免费服守护：每 6 小时检测一次，停了就直接调 API 开机。
# 直连（不走代理）。注意：GitHub Actions 的 IP 直连 plugged 面板实测会返回 403，
# 若 403 持续，定时检测会失败，需要换运行位置或加代理。

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检测不开机 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: plugged-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检测并开机
        env:
          PLUGGED_API_KEY: ${{ secrets.PLUGGED_API_KEY }}
          PLUGGED_SERVERS: '75cd14b3-aaf3-4a1c-a214-dbd787e76d5a'
          POWER_WAIT_SECONDS: '480'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== 干跑模式：只读状态，不开机 =="
            python3 plugged_state.py
            exit 0
          fi
          python3 plugged_keepalive.py
