name: MCWorldHost Daily

# 派发器（本文件只负责调度与出口准备，业务脚本全在 mcworldhost 分支）
#
# 为什么必须有 WARP：GitHub runner 是机房 IP，Adsterra 对其返回 403，
# AFK 页的广告探测拿不到 ok → 服务端一分币都不计（诊断跑 43673423044 实证：
# 浏览器开满 6 分钟，余额 285→285）。走 Cloudflare WARP 出口后广告正常加载，
# 14 分钟实测 +42 币（run 43674080181）。
#
# 每日流程：签到 → 余额≥500 买 7 天 → 不足且剩余<12h 先买 24h 兜底 → 挂 AFK 50 分钟
# 不伪造任何广告状态，只做真实浏览。

on:
  schedule:
    # 一天两次，每次挂满 6 小时（340 分钟，避开 GitHub 360 分钟硬上限）。
    # UTC 02:00 = 北京 10:00 → 挂到 16:00；UTC 14:00 = 北京 22:00 → 挂到次日 04:00。
    # 站点日上限 500 币：吃满即停（脚本读服务端 dayLimitReached 判定），
    # 拿不到积分也会在约 8 分钟内退出 —— 不会白占满 6 小时机时。
    # 单次上限 340 分钟只是「兜底天花板」，正常远用不到。
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'AFK 挂机分钟数（默认 340 = 6 小时上限内留余量）'
        required: false
        default: '85'

permissions:
  contents: read

concurrency:
  group: mcwh-daily-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout mcworldhost branch (shared business branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Start Cloudflare WARP SOCKS5 proxy
        run: |
          set -e
          mkdir -p /tmp/warp && cd /tmp/warp
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          chmod +x wgcf
          curl -fsSL -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy

          WARP_PROFILE="${{ secrets.MCWH_WARP_PROFILE }}"
          if [ -n "$WARP_PROFILE" ]; then
            echo "♻️ 使用已保存的 WARP 配置（避免 wgcf register 撞 429）"
            printf '%s\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' "$WARP_PROFILE" > wgcf-profile.conf
          else
            echo "⚠️ 没有 MCWH_WARP_PROFILE，尝试现场注册"
            if ./wgcf register --accept-tos && ./wgcf generate; then
              printf '\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' >> wgcf-profile.conf
            else
              echo "::error::wgcf register 失败（多半是 429 限流）。跳过 WARP，直连出口大概率不计币。"
              echo "WARP_OK=0" >> $GITHUB_ENV
              exit 0
            fi
          fi

          nohup ./wireproxy -c wgcf-profile.conf > /tmp/warp/wireproxy.log 2>&1 &
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS --max-time 6 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace > /tmp/warp/trace; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = "1" ]; then
            echo "WARP_OK=1" >> $GITHUB_ENV
            echo "=== WARP trace ==="
            grep -E '^(ip|loc|warp)=' /tmp/warp/trace
          else
            echo "::warning::WARP 未连上，本轮退回直连（大概率拿不到积分）"
            echo "WARP_OK=0" >> $GITHUB_ENV
            tail -20 /tmp/warp/wireproxy.log
          fi

      - name: Check Adsterra reachability
        run: |
          PROXY=""
          [ "${WARP_OK:-0}" = "1" ] && PROXY="-x socks5h://127.0.0.1:40000"
          echo "egress proxy: ${PROXY:-direct}"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36'
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -x socks5h://127.0.0.1:40000 \
            ${PROXY} -A "$UA" -H "Referer: https://mcworldhost.de/" \
            "https://www.highperformanceformat.com/d9ea19489d57516b42e85c76756ada44/invoke.js" || echo 000)
          echo "Adsterra via WARP: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::广告在 WARP 出口仍不可达（HTTP $code），本次大概率不计币"
          fi

      - name: Daily claim + AFK + renew
        env:
          MCWH_EMAIL: ${{ secrets.MCWH_EMAIL }}
          MCWH_PASSWORD: ${{ secrets.MCWH_PASSWORD }}
          MCWH_PROXY: ${{ env.WARP_OK == '1' && 'socks5://127.0.0.1:40000' || '' }}
          MCWH_AFK_MAX_MINUTES: ${{ github.event.inputs.minutes || '85' }}
          MCWH_BUY_7D_AT: '500'
        run: python .github/scripts/mcworldhost_daily.py

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcwh-daily
          path: |
            mcwh_debug_*.png
            mcwh_debug_*.txt
          if-no-files-found: ignore
