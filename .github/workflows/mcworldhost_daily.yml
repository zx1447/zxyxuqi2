name: MCWorldHost Daily
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcwh-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcworldhost
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      # 出口必须是「干净 IP」：Adsterra 对机房 IP 拒发广告（AFK 页卡在
      # Checking ads...，两个广告位空白，一分不计 —— run 45733243435 截图实证）。
      # WARP 出口历史实证 +3 币/分钟；订阅隧道出口（VPS）已被拉黑，仅作兜底保登录。
      - name: Start WARP egress
        run: |
          set -e
          mkdir -p /tmp/warp && cd /tmp/warp
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          chmod +x wgcf
          curl -fsSL -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy
          WARP_PROFILE="${{ secrets.MCWH_WARP_PROFILE }}"
          if [ -n "$WARP_PROFILE" ]; then
            echo "使用已保存的 WARP 配置"
            printf '%s\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' "$WARP_PROFILE" > wgcf-profile.conf
          elif ./wgcf register --accept-tos && ./wgcf generate; then
            printf '\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' >> wgcf-profile.conf
          else
            echo "::warning::wgcf register 失败（多半 429 限流），回退订阅隧道"
            echo "WARP_OK=0" >> $GITHUB_ENV
            exit 0
          fi
          nohup ./wireproxy -c wgcf-profile.conf > /tmp/warp/wireproxy.log 2>&1 &
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS --max-time 6 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace > /tmp/warp/trace; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = "1" ]; then
            echo "WARP_OK=1" >> $GITHUB_ENV
            echo "=== WARP trace ==="
            grep -E '^(ip|loc|warp)=' /tmp/warp/trace
          else
            echo "::warning::WARP 未连上，回退订阅隧道"
            echo "WARP_OK=0" >> $GITHUB_ENV
            tail -20 /tmp/warp/wireproxy.log
          fi
      - name: Fallback to subscription tunnel
        if: env.WARP_OK != '1'
        env:
          AFK_SUBSCRIPTION_URL: ${{ secrets.AFK_SUBSCRIPTION_URL }}
        run: |
          set -eu
          python .github/scripts/mcwh_subscription_proxy.py
          curl -fsSL --max-time 45 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  /tmp/xray.zip' | sha256sum -c -
          unzip -qo /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray run -test -config /tmp/afk-proxy.json >/dev/null
          nohup /tmp/xray/xray run -config /tmp/afk-proxy.json >/tmp/xray.log 2>&1 &
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --noproxy '' --max-time 8 -x http://127.0.0.1:17890 https://www.cloudflare.com/cdn-cgi/trace >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo '::error::WARP 与订阅隧道都不可用；不回退直连'; exit 1; fi
          echo '订阅隧道连通（注意：该出口可能拿不到广告积分，仅保登录/签到）'
      - name: Adsterra reachability (informational)
        run: |
          if [ "${WARP_OK:-0}" = "1" ]; then P="-x socks5h://127.0.0.1:40000"; else P="-x http://127.0.0.1:17890"; fi
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 $P -A "$UA" -H "Referer: https://mcworldhost.de/" \
            "https://www.highperformanceformat.com/d9ea19489d57516b42e85c76756ada44/invoke.js" || echo 000)
          echo "Adsterra probe: HTTP $code（curl 探测仅供参考，反作弊可能 403/返回空脚本；最终以真实浏览器积分为准）"
      - name: Daily claim + AFK + renew
        env:
          MCWH_EMAIL: ${{ secrets.MCWH_EMAIL }}
          MCWH_PASSWORD: ${{ secrets.MCWH_PASSWORD }}
          MCWH_PROXY: ${{ env.WARP_OK == '1' && 'socks5://127.0.0.1:40000' || 'socks5://127.0.0.1:17891' }}
          MCWH_BUY_7D_AT: '500'
        run: python .github/scripts/mcworldhost_daily.py
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcwh-daily
          path: |
            mcwh_debug_*.png
            mcwh_debug_*.txt
          if-no-files-found: ignore
